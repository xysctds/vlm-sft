# 数据量消融中间点：schema 指令 + 20k 子集（与 schema-5k / simple-5k 同属数据量/指令消融）
# 参数与 qwen3vl8b_dfattr_ablate_schema5k_train.yaml 同步；差异仅：max_samples 20000、warmup_steps 按同口径 5% 折算（80 vs 20）、output_dir —— 保证消融唯一变量 = 训练数据量
# 运行（单机多卡自动 DDP，默认全部可见 GPU；本机 3 卡）：
#   llamafactory-cli train experiments/ablation/config/qwen3vl8b_dfattr_ablate_schema20k_train.yaml
# 或直接执行 experiments/ablation/scripts/run_ablate_20k.sh

stage: sft
do_train: true
model_name_or_path: models/Qwen3-VL-8B-Instruct
preprocessing_num_workers: 16
finetuning_type: lora
template: qwen3_vl_nothink
flash_attn: auto
dataset_dir: data/data_convert/deepfashion_multi
dataset: deepfashion_attr_json_train
cutoff_len: 2048
learning_rate: 0.0001
num_train_epochs: 3.0
max_samples: 20000              # 唯一差异：数据量 20k（5k 消融为 5000，主训练为全量 35,276）
seed: 42
per_device_train_batch_size: 4
gradient_accumulation_steps: 3   # 3 卡 DDP：等效 batch = 4(每卡) × 3(卡) × 3 = 36；单卡跑改 9
lr_scheduler_type: cosine
max_grad_norm: 1.0
logging_steps: 10
save_steps: 1000   # 与 5k 消融一致：消融只需最终模型
warmup_steps: 80   # 按 5k 同口径 5% 折算：20k×3epoch ≈ 1,583 步 × 5% ≈ 79（5k 为 20/396 = 5%）
packing: false
enable_thinking: true
report_to: none
output_dir: experiments/ablation/weights/schema_20k
bf16: true
plot_loss: true
trust_remote_code: true
ddp_timeout: 180000000
include_num_input_tokens_seen: true
optim: adamw_torch
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
freeze_multi_modal_projector: true
image_max_pixels: 825750       # 原图 750×1101 = 825,750 像素，与主训练一致（不压缩）
image_min_pixels: 1024
video_max_pixels: 65536
video_min_pixels: 256
val_size: 0.05                  # 从 20k 内部切 5%（1,000 条）画 val loss 曲线（与手动 val/test 零重叠）
eval_strategy: steps
eval_steps: 100
per_device_eval_batch_size: 4

# 消融（27B）：指令范式 × 数据量 —— simple 指令 + 5k 数据
#
# 与 schema5k 版的唯一差异 = dataset（deepfashion_attr_json_train -> deepfashion_attr_json_simple_train）
# 与 output_dir。这正是「指令范式消融」的单变量设计（同数据量，唯一变量=指令范式）。
# 对应 8B 消融配置 experiments/qwen3vl8b/ablation/config/qwen3vl8b_dfattr_ablate_simple5k_train.yaml。
#
# 注：两个 arm 的最终评测都在 **schema 指令的 val 集**（deepfashion_attr_json_val）上做，
#     即测试期 prompt 固定为 schema，只变训练期指令 —— 与 8B 消融口径完全一致。
#
# 运行：bash experiments/qwen38_27b/ablation/scripts/run_ablate_27b.sh simple5k

stage: sft
do_train: true
model_name_or_path: models/Qwen3.8-27B
preprocessing_num_workers: 16
finetuning_type: lora
template: qwen3_5
enable_thinking: false
flash_attn: auto
deepspeed: experiments/qwen38_27b/main/config/ds_z3_27b.json
use_reentrant_gc: false
dataset_dir: data/data_convert/deepfashion_multi
dataset: deepfashion_attr_json_simple_train
cutoff_len: 2048
learning_rate: 0.0001
num_train_epochs: 3.0
max_samples: 5000
seed: 42
per_device_train_batch_size: 4
gradient_accumulation_steps: 3   # 等效 batch = 4 × 3 × 3 = 36
lr_scheduler_type: cosine
max_grad_norm: 1.0
logging_steps: 10
save_steps: 1000
warmup_steps: 20
packing: false
report_to: none
output_dir: experiments/qwen38_27b/ablation/weights/qwen38_27b_simple_5k
bf16: true
plot_loss: true
trust_remote_code: true
ddp_timeout: 180000000
include_num_input_tokens_seen: true
optim: adamw_torch
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
freeze_multi_modal_projector: true
image_max_pixels: 825750
image_min_pixels: 1024
video_max_pixels: 65536
video_min_pixels: 256
val_size: 0.05
eval_strategy: steps
eval_steps: 100
per_device_eval_batch_size: 4

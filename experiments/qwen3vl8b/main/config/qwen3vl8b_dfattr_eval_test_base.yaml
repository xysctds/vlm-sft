# 正式评测（方案 A）：基座 0-shot 在 val 上生成预测（与训练同口径的 llamafactory 管线）
# 与 qwen3vl8b_dfattr_eval_val_lora.yaml 唯一差异：无 adapter（测纯基座）
# 运行：llamafactory-cli train experiments/qwen3vl8b/main/config/qwen3vl8b_dfattr_eval_test_base.yaml
# 之后：python scripts/convert_preds.py --preds <output_dir>/generated_predictions.jsonl \
#       --data data/data_convert/deepfashion_multi/deepfashion_attr_json_test.jsonl \
#       --out experiments/qwen3vl8b/main/reports/preds_val_base.jsonl

stage: sft
model_name_or_path: models/Qwen3-VL-8B-Instruct
preprocessing_num_workers: 4   # 两路并行时共 8 个 worker，避免 32 worker × 128 线程过度订阅打爆共享机 CPU（load 800+ 实测）
finetuning_type: lora   # 与 WebUI 默认一致；无 adapter_name_or_path 时即加载纯 base（loader 仅在 adapter 非空时走 PeftModel 分支），与 lora 配置的唯一差异就是 adapter
quantization_method: bnb   # 与训练/WebUI 默认一致；quantization_bit 默认 none => 实际不量化（bf16 加载）
template: qwen3_vl_nothink
flash_attn: auto
dataset_dir: data/data_convert/deepfashion_multi
eval_dataset: deepfashion_attr_json_test
cutoff_len: 2048
max_samples: 100000
per_device_eval_batch_size: 4
predict_with_generate: true
report_to: none
max_new_tokens: 512
do_sample: false   # greedy 确定性解码（transformers>=5.8 不接受 temperature=0.0，用 do_sample 声明）
seed: 42
image_max_pixels: 825750   # 原图 750×1101 = 825,750 像素，与训练一致（不压缩）
output_dir: experiments/qwen3vl8b/main/predictions/test_base
trust_remote_code: true
ddp_timeout: 180000000
do_predict: true

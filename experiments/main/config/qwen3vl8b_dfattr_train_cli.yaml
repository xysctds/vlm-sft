# LoRA 微调：Qwen3-VL-8B-Instruct 在 DeepFashion 属性 JSON 抽取任务上（主线任务）
# 扁平 CLI 格式 —— 与 experiments/main/config/qwen3vl8b_dfattr_train.yaml（WebUI 分层格式）等价，
# 参数以实际训练记录 experiments/main/weights/lora/qwen3vl8b_dfattr_lora/training_args.yaml 为准，字段顺序略有不同。
# 运行（单机多卡自动走 torchrun DDP，默认用全部可见 GPU）：
#   3 卡 DDP（本机 3×4090，等效 batch = 4×3×3 = 36）：
#     llamafactory-cli train experiments/main/config/qwen3vl8b_dfattr_train_cli.yaml
#   单卡：用 CUDA_VISIBLE_DEVICES=0 限制单卡，并把 gradient_accumulation_steps 改为 9（保持等效 batch 36）；output_dir 按需修改
#   如需跳过某张卡（如留给 vLLM/检索）：CUDA_VISIBLE_DEVICES=0,1 等限制可见卡即可（nproc 自动取可见卡数）

stage: sft
do_train: true
model_name_or_path: models/Qwen3-VL-8B-Instruct
preprocessing_num_workers: 16
finetuning_type: lora
template: qwen3_vl_nothink
flash_attn: auto
dataset_dir: data/data_convert/deepfashion_multi
dataset: deepfashion_attr_json_train
cutoff_len: 2048
learning_rate: 0.0001
num_train_epochs: 3.0
max_samples: 100000
seed: 42
per_device_train_batch_size: 4
gradient_accumulation_steps: 3   # 3 卡 DDP：等效 batch = 4(每卡) × 3(卡) × 3 = 36；单卡跑改 9
lr_scheduler_type: cosine
max_grad_norm: 1.0
logging_steps: 10
save_steps: 100                 # WebUI 中 eval 频率 = save 频率（eval_steps 强制等于 save_steps）
warmup_steps: 150               # ≈5.4% × 2,793 步
packing: false
enable_thinking: true
report_to: none
output_dir: experiments/main/weights/lora/qwen3vl8b_dfattr_lora
bf16: true
plot_loss: true
trust_remote_code: true
ddp_timeout: 180000000
include_num_input_tokens_seen: true
optim: adamw_torch
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
freeze_multi_modal_projector: true
image_max_pixels: 825750       # 原图 750×1101 = 825,750 像素，与训练一致（不压缩）
image_min_pixels: 1024
video_max_pixels: 65536
video_min_pixels: 256
val_size: 0.05                  # 从训练集内部切 5% 画 val loss 曲线（与手动 val/test 零重叠）
eval_strategy: steps
eval_steps: 100
per_device_eval_batch_size: 4

# 图像分辨率消融（推理端）：压缩版（image_max_pixels=589,824 = 768×768，原图会被压缩）
# 与 qwen3vl8b_dfattr_eval_val_lora.yaml 唯一差异：image_max_pixels 589824（对照不压缩版 825750）
# 运行：llamafactory-cli train llamafactory/config/qwen3vl8b_dfattr_eval_val_lora_compress.yaml
# 之后：convert + stats 与 preds_val_lora.jsonl（不压缩，attr acc 93.4%）对比

stage: sft
model_name_or_path: ${oc.env:LLM_MODEL_PATH, models/Qwen3-VL-8B-Instruct}
adapter_name_or_path: llamafactory/saves/dfattr/lora/qwen3vl8b_dfattr_lora
preprocessing_num_workers: 4
finetuning_type: lora
quantization_method: bnb
template: qwen3_vl_nothink
flash_attn: auto
dataset_dir: data/data_convert/deepfashion_multi
eval_dataset: deepfashion_attr_json_val
cutoff_len: 2048
max_samples: 100000
per_device_eval_batch_size: 4
predict_with_generate: true
report_to: none
max_new_tokens: 512
do_sample: false
seed: 42
image_max_pixels: 589824   # 768×768 像素，压缩原图（对照：825750 不压缩）
output_dir: llamafactory/eval_outputs/val_lora_compress
trust_remote_code: true
ddp_timeout: 180000000
do_predict: true
